[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "openapply"
version = "0.1.0"
description = "Open-source, human-in-the-loop internship application assistant: discover, filter, rank, tailor, pre-fill. You click Submit."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27",
  "pydantic>=2.6",
  "pyyaml>=6",
  "typer>=0.12",
  "rich>=13",
  "scikit-learn>=1.4",
  "python-dotenv>=1.0",
  "anthropic>=1.0",
  "playwright>=1.45",
]

[project.optional-dependencies]
sheets = ["gspread>=6.0"]
dev = ["pytest>=8"]

[project.scripts]
openapply = "openapply.cli:app"

[tool.setuptools.packages.find]
include = ["openapply*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
