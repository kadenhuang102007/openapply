<!DOCTYPE html>
<!-- Crafted fixture: Workday candidate apply flow (Application Questions). Structure and data-automation-id
     values follow Workday's wd1/wd5 external career site markup (progressBar, applyFlow*Page,
     formField-*, dateSection*-input, searchBox, add-button, bottom-navigation-next-button). -->
<html><head><meta charset="utf-8"><title>Application Questions | Acme Careers</title></head><body>
<div data-automation-id="header"><button data-automation-id="utilityButtonSignIn">Sign In</button></div>
<div data-automation-id="applyFlowPage">
<button data-automation-id="backToJobPosting">Back to Job Posting</button>
<h2 data-automation-id="jobTitleHeading">Software Engineer Intern (Summer 2027)</h2>
<ol data-automation-id="progressBar">
  <li data-automation-id="progressBarCompletedStep"><label>step 1 of 7</label><label>Create Account/Sign In</label></li>
  <li data-automation-id="progressBarCompletedStep"><label>step 2 of 7</label><label>My Information</label></li>
  <li data-automation-id="progressBarCompletedStep"><label>step 3 of 7</label><label>My Experience</label></li>
  <li data-automation-id="progressBarActiveStep"><label>current step 4 of 7</label><label>Application Questions</label></li>
  <li data-automation-id="progressBarInactiveStep"><label>step 5 of 7</label><label>Voluntary Disclosures</label></li>
  <li data-automation-id="progressBarInactiveStep"><label>step 6 of 7</label><label>Self Identify</label></li>
  <li data-automation-id="progressBarInactiveStep"><label>step 7 of 7</label><label>Review</label></li>
</ol>
<div data-automation-id="applyFlowPrimaryQuestionsPage">
<h2>Application Questions</h2>
<div data-automation-id="formField-q1"><label for="primaryQuestionnaire--q1">Are you legally authorized to work in the United States?<abbr title="required">*</abbr></label><button type="button" id="primaryQuestionnaire--q1" aria-haspopup="listbox" data-options="Yes|No">Select One</button></div>
<div data-automation-id="formField-q2"><label for="primaryQuestionnaire--q2">Will you now or in the future require sponsorship for employment visa status (e.g., H-1B visa status)?<abbr title="required">*</abbr></label><button type="button" id="primaryQuestionnaire--q2" aria-haspopup="listbox" data-options="Yes|No">Select One</button></div>
<div data-automation-id="formField-q3"><label for="primaryQuestionnaire--q3">Have you completed an internship before?<abbr title="required">*</abbr></label><button type="button" id="primaryQuestionnaire--q3" aria-haspopup="listbox" data-options="Yes|No">Select One</button></div>
<div data-automation-id="formField-q4"><label for="primaryQuestionnaire--q4">What is your expected graduation date?<abbr title="required">*</abbr></label><button type="button" id="primaryQuestionnaire--q4" aria-haspopup="listbox" data-options="December 2026|May 2027|December 2027|May 2028|Other">Select One</button></div>
<div data-automation-id="formField-q5"><label for="primaryQuestionnaire--q5">Do you consent to receive SMS text messages from Acme about your application?</label><button type="button" id="primaryQuestionnaire--q5" aria-haspopup="listbox" data-options="Yes|No">Select One</button></div>
<div data-automation-id="formField-q6"><label for="primaryQuestionnaire--q6">Why are you interested in Acme?<abbr title="required">*</abbr></label><textarea id="primaryQuestionnaire--q6"></textarea></div>
</div>
<div data-automation-id="pageFooter">
  <button data-automation-id="bottom-navigation-back-button" type="button">Back</button>
  <button data-automation-id="bottom-navigation-next-button" type="button" data-next="voluntary_disclosures.html">Save and Continue</button>
</div>
</div>
</body></html>
