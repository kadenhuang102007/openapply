<!DOCTYPE html>
<!-- Crafted fixture: Workday candidate apply flow (Voluntary Disclosures). Structure and data-automation-id
     values follow Workday's wd1/wd5 external career site markup (progressBar, applyFlow*Page,
     formField-*, dateSection*-input, searchBox, add-button, bottom-navigation-next-button). -->
<html><head><meta charset="utf-8"><title>Voluntary Disclosures | Acme Careers</title></head><body>
<div data-automation-id="header"><button data-automation-id="utilityButtonSignIn">Sign In</button></div>
<div data-automation-id="applyFlowPage">
<button data-automation-id="backToJobPosting">Back to Job Posting</button>
<h2 data-automation-id="jobTitleHeading">Software Engineer Intern (Summer 2027)</h2>
<ol data-automation-id="progressBar">
  <li data-automation-id="progressBarCompletedStep"><label>step 1 of 7</label><label>Create Account/Sign In</label></li>
  <li data-automation-id="progressBarCompletedStep"><label>step 2 of 7</label><label>My Information</label></li>
  <li data-automation-id="progressBarCompletedStep"><label>step 3 of 7</label><label>My Experience</label></li>
  <li data-automation-id="progressBarCompletedStep"><label>step 4 of 7</label><label>Application Questions</label></li>
  <li data-automation-id="progressBarActiveStep"><label>current step 5 of 7</label><label>Voluntary Disclosures</label></li>
  <li data-automation-id="progressBarInactiveStep"><label>step 6 of 7</label><label>Self Identify</label></li>
  <li data-automation-id="progressBarInactiveStep"><label>step 7 of 7</label><label>Review</label></li>
</ol>
<div data-automation-id="applyFlowVoluntaryDisclosuresPage">
<h2>Voluntary Disclosures</h2>
<div data-automation-id="formField-gender"><label for="personalInfoUS--gender">Gender<abbr title="required">*</abbr></label><button type="button" id="personalInfoUS--gender" aria-haspopup="listbox" data-options="Female|Male|I do not wish to self-identify">Select One</button></div>
<div data-automation-id="formField-hispanicOrLatino"><label for="personalInfoUS--hispanicOrLatino">Are you Hispanic or Latino?<abbr title="required">*</abbr></label><button type="button" id="personalInfoUS--hispanicOrLatino" aria-haspopup="listbox" data-options="Yes|No|I do not wish to self-identify">Select One</button></div>
<div data-automation-id="formField-ethnicity"><label for="personalInfoUS--ethnicity">Please select the ethnicity (race) which most accurately describes how you identify yourself<abbr title="required">*</abbr></label><button type="button" id="personalInfoUS--ethnicity" aria-haspopup="listbox" data-options="American Indian or Alaska Native (Not Hispanic or Latino) (United States of America)|Asian (Not Hispanic or Latino) (United States of America)|Black or African American (Not Hispanic or Latino) (United States of America)|White (Not Hispanic or Latino) (United States of America)|Two or More Races (Not Hispanic or Latino) (United States of America)|I do not wish to self-identify (United States of America)">Select One</button></div>
<div data-automation-id="formField-veteranStatus"><label for="personalInfoUS--veteranStatus">Veteran Status<abbr title="required">*</abbr></label><button type="button" id="personalInfoUS--veteranStatus" aria-haspopup="listbox" data-options="I am not a protected veteran|I identify as one or more of the classifications of protected veteran|I do not wish to self-identify">Select One</button></div>
<div data-automation-id="formField-acceptTermsAndAgreements"><input type="checkbox" id="termsAndConditions--acceptTermsAndAgreements"><label for="termsAndConditions--acceptTermsAndAgreements">I acknowledge that I have read and agree to the Acme privacy notice<abbr title="required">*</abbr></label></div>
</div>
<div data-automation-id="pageFooter">
  <button data-automation-id="bottom-navigation-back-button" type="button">Back</button>
  <button data-automation-id="bottom-navigation-next-button" type="button" data-next="self_identify.html">Save and Continue</button>
</div>
</div>
</body></html>
