<!DOCTYPE html>
<!-- Crafted fixture: Workday candidate apply flow (My Experience). Structure and data-automation-id
     values follow Workday's wd1/wd5 external career site markup (progressBar, applyFlow*Page,
     formField-*, dateSection*-input, searchBox, add-button, bottom-navigation-next-button). -->
<html><head><meta charset="utf-8"><title>My Experience | Acme Careers</title></head><body>
<div data-automation-id="header"><button data-automation-id="utilityButtonSignIn">Sign In</button></div>
<div data-automation-id="applyFlowPage">
<button data-automation-id="backToJobPosting">Back to Job Posting</button>
<h2 data-automation-id="jobTitleHeading">Software Engineer Intern (Summer 2027)</h2>
<ol data-automation-id="progressBar">
  <li data-automation-id="progressBarCompletedStep"><label>step 1 of 7</label><label>Create Account/Sign In</label></li>
  <li data-automation-id="progressBarCompletedStep"><label>step 2 of 7</label><label>My Information</label></li>
  <li data-automation-id="progressBarActiveStep"><label>current step 3 of 7</label><label>My Experience</label></li>
  <li data-automation-id="progressBarInactiveStep"><label>step 4 of 7</label><label>Application Questions</label></li>
  <li data-automation-id="progressBarInactiveStep"><label>step 5 of 7</label><label>Voluntary Disclosures</label></li>
  <li data-automation-id="progressBarInactiveStep"><label>step 6 of 7</label><label>Self Identify</label></li>
  <li data-automation-id="progressBarInactiveStep"><label>step 7 of 7</label><label>Review</label></li>
</ol>
<div data-automation-id="applyFlowMyExpPage">
<h2>My Experience</h2>
<div role="group" aria-labelledby="Work-Experience-section" data-section="workExperience"><h3 id="Work-Experience-section">Work Experience</h3><template><div data-panel="1" data-automation-id="workExperience-{n}" role="group" aria-labelledby="Work-Experience-{n}-panel"><h4 id="Work-Experience-{n}-panel">Work Experience {n}</h4><div data-automation-id="formField-jobTitle"><label for="workExperience-{n}--jobTitle">Job Title<abbr title="required">*</abbr></label><input type="text" id="workExperience-{n}--jobTitle" aria-required="true"></div><div data-automation-id="formField-companyName"><label for="workExperience-{n}--companyName">Company<abbr title="required">*</abbr></label><input type="text" id="workExperience-{n}--companyName" aria-required="true"></div><div data-automation-id="formField-location"><label for="workExperience-{n}--location">Location</label><input type="text" id="workExperience-{n}--location" aria-required="false"></div><div data-automation-id="formField-currentlyWorkHere"><input type="checkbox" id="workExperience-{n}--currentlyWorkHere"><label for="workExperience-{n}--currentlyWorkHere">I currently work here</label></div><div data-automation-id="formField-startDate"><label>From<abbr title="required">*</abbr></label><div data-automation-id="dateInputWrapper"><input type="text" role="spinbutton" data-automation-id="dateSectionMonth-input" id="workExperience-{n}--startDate-dateSectionMonth-input" aria-label="Month"><input type="text" role="spinbutton" data-automation-id="dateSectionYear-input" id="workExperience-{n}--startDate-dateSectionYear-input" aria-label="Year"></div></div><div data-automation-id="formField-endDate"><label>To<abbr title="required">*</abbr></label><div data-automation-id="dateInputWrapper"><input type="text" role="spinbutton" data-automation-id="dateSectionMonth-input" id="workExperience-{n}--endDate-dateSectionMonth-input" aria-label="Month"><input type="text" role="spinbutton" data-automation-id="dateSectionYear-input" id="workExperience-{n}--endDate-dateSectionYear-input" aria-label="Year"></div></div><div data-automation-id="formField-roleDescription"><label for="workExperience-{n}--roleDescription">Role Description</label><textarea id="workExperience-{n}--roleDescription"></textarea></div><button type="button" data-automation-id="panel-set-delete-button">Delete</button></div></template><button type="button" data-automation-id="add-button" aria-label="Add Work Experience">Add</button></div>
<div role="group" aria-labelledby="Education-section" data-section="education"><h3 id="Education-section">Education</h3><template><div data-panel="1" data-automation-id="education-{n}" role="group" aria-labelledby="Education-{n}-panel"><h4 id="Education-{n}-panel">Education {n}</h4><div data-automation-id="formField-schoolName"><label for="education-{n}--schoolName">School or University<abbr title="required">*</abbr></label><div data-automation-id="multiselectInputContainer"><input type="text" id="education-{n}--schoolName" data-automation-id="searchBox" placeholder="Search" data-options="University of California, Berkeley|University of California, Los Angeles|Stanford University"></div></div><div data-automation-id="formField-degree"><label for="education-{n}--degree">Degree<abbr title="required">*</abbr></label><button type="button" id="education-{n}--degree" aria-haspopup="listbox" data-options="High School Diploma|Associate's Degree|Bachelor's Degree|Master's Degree|Doctorate">Select One</button></div><div data-automation-id="formField-fieldOfStudy"><label for="education-{n}--fieldOfStudy">Field of Study<abbr title="required">*</abbr></label><div data-automation-id="multiselectInputContainer"><input type="text" id="education-{n}--fieldOfStudy" data-automation-id="searchBox" placeholder="Search" data-options="Computer Science|Data Science|Economics"></div></div><div data-automation-id="formField-gradeAverage"><label for="education-{n}--gradeAverage">Overall Result (GPA)</label><input type="text" id="education-{n}--gradeAverage" aria-required="false"></div><div data-automation-id="formField-firstYearAttended"><label>From<abbr title="required">*</abbr></label><div data-automation-id="dateInputWrapper"><input type="text" role="spinbutton" data-automation-id="dateSectionYear-input" id="education-{n}--firstYearAttended-dateSectionYear-input" aria-label="Year"></div></div><div data-automation-id="formField-lastYearAttended"><label>To (Actual or Expected)<abbr title="required">*</abbr></label><div data-automation-id="dateInputWrapper"><input type="text" role="spinbutton" data-automation-id="dateSectionYear-input" id="education-{n}--lastYearAttended-dateSectionYear-input" aria-label="Year"></div></div><button type="button" data-automation-id="panel-set-delete-button">Delete</button></div></template><button type="button" data-automation-id="add-button" aria-label="Add Education">Add</button></div>
<div role="group" aria-labelledby="Resume-section"><h3 id="Resume-section">Resume/CV</h3><div data-automation-id="formField-resumeAttachments"><div data-automation-id="file-upload-drop-zone"><input type="file" data-automation-id="file-upload-input-ref" aria-label="Upload a file"></div></div></div>
<div role="group" aria-labelledby="Websites-section" data-section="webAddress"><h3 id="Websites-section">Websites</h3><template><div data-panel="1" data-automation-id="webAddress-{n}" role="group" aria-labelledby="Websites-{n}-panel"><h4 id="Websites-{n}-panel">Websites {n}</h4><div data-automation-id="formField-url"><label for="webAddress-{n}--url">URL<abbr title="required">*</abbr></label><input type="text" id="webAddress-{n}--url" aria-required="true"></div><button type="button" data-automation-id="panel-set-delete-button">Delete</button></div></template><button type="button" data-automation-id="add-button" aria-label="Add Websites">Add</button></div>
<div role="group" aria-labelledby="Social-section"><h3 id="Social-section">Social Network URLs</h3><div data-automation-id="formField-linkedInAccount"><label for="socialNetworkAccounts--linkedInAccount">LinkedIn</label><input type="text" id="socialNetworkAccounts--linkedInAccount" aria-required="false"></div></div>
</div>
<div data-automation-id="pageFooter">
  <button data-automation-id="bottom-navigation-back-button" type="button">Back</button>
  <button data-automation-id="bottom-navigation-next-button" type="button" data-next="application_questions.html">Save and Continue</button>
</div>
</div>
</body></html>
