# Established companies, grouped by tier. Used by the `established_only` filter
# (profile setting) and `openapply rank --established-only / --include-startups`.
#
# How matching works: names are compared after normalizing both sides, so you
# don't need every spelling. Normalizing means: lowercase, accents removed,
# "&" read as "and", anything in (parentheses) also tried without it, a leading
# "The" dropped, trailing legal words dropped (Inc, LLC, Ltd, Corp, Corporation,
# Co, Company, PLC, Holdings, Group, LP, LLP, SA, AG, NV, SE, GmbH), then all
# spaces and punctuation removed. So "JPMorgan Chase & Co.", "JPMorganChase"
# and "JPMorgan Chase" are the same key. Matching is exact on that key (no fuzzy guessing), so "Meta"
# never matches "Metadata". Add an alias when a company goes by a different name.
#
# Format: each entry is either a plain name, or `Name: [alias, alias, ...]`.
# The same key may not appear under two entries (the loader checks).
#
# The bar: big tech, well-known public tech, elite late-stage private tech,
# top quant/trading firms, major banks / asset managers / fintech, and large
# (roughly Fortune 500) companies that hire tech/product/data interns.
# Seed through Series B startups are deliberately absent. When in doubt, a
# company was left out; add it yourself if you disagree.

